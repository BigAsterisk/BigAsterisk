site_name: BigAsterisk
site_description: A unified debugging and testing platform for Apache Spark
site_url: https://bigasterisk.github.io/BigAsterisk/
repo_url: https://github.com/BigAsterisk/BigAsterisk
repo_name: BigAsterisk/BigAsterisk
docs_dir: docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: install.md
  - Usage: usage.md
  - Architecture: architecture.md
  - Tools:
      - Titian (data provenance): titian.md
      - BigSift (automated debugging): bigsift.md
      - DeSQL (step-through SQL): desql.md
      - BigDebug (watchpoints): bigdebug.md
      - Vega (incremental re-execution): vega.md
      - OptDebug (operation isolation): optdebug.md
  - Reference:
      - Command & flag reference: reference.md
      - TPC-DS coverage: tpcds.md
      - Ablation & performance: ablation.md
      - Ablation results: ablation-results.md
  - Developer guide: developer-guide.md
  - Citations: citations.md
  - API reference (Scaladoc): api/index.html

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# The Scaladoc API site is generated separately (`sbt doc`) and copied into
# docs/api/ before building, so it serves under /api/ alongside the manual:
#   bin/sbt doc && rm -rf docs/api && cp -r modules/spark4/target/scala-2.13/api docs/api \
#     && mkdocs build
