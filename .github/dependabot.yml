version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci" }

# There is no pip ecosystem here on purpose: the Python front end depends only on the
# PySpark that the user already runs, and there is no manifest for Dependabot to read.
# sbt is not natively supported, so library and plugin versions in project/ are bumped
# by hand against the Spark version the binding declares.
