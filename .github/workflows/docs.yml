name: Documentation

# Publishes the manual and the API reference to GitHub Pages. The site is built in CI on
# every pull request too (see ci.yml), so a broken link fails review rather than
# publication.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never publish two builds at once, and let a newer commit supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: pip install mkdocs-material

      # The manual links to api/index.html, so the Scaladoc has to exist before the
      # strict build can resolve it.
      - name: Build the API reference
        run: |
          sbt -batch unidoc
          rm -rf docs/api
          cp -r target/scala-2.13/unidoc docs/api

      - name: Build the site
        run: mkdocs build --strict

      # `enablement` turns Pages on through the API when it is off. An organization
      # can forbid that, and a repository whose owner has never opted into Pages cannot
      # be published to at all — neither is a fault in the documentation, which has
      # already been built strictly by this point, so publication is allowed to be
      # skipped with a warning rather than failing the workflow on every push.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Explain a skipped publication
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::warning title=Documentation not published::The site built cleanly, but GitHub Pages is not enabled for this repository."
          {
            echo "### Documentation built, not published"
            echo
            echo "\`mkdocs build --strict\` succeeded and the API reference was generated,"
            echo "but GitHub Pages is not enabled here, so there was nowhere to publish to."
            echo
            echo "Enable it once under **Settings → Pages → Build and deployment**, with"
            echo "**Source: GitHub Actions**. The next push to \`main\` will publish."
          } >> "$GITHUB_STEP_SUMMARY"

      # Somewhere to read the manual from until Pages is on: the same site, downloadable
      # from this run's summary page.
      - name: Upload the site as a downloadable artifact
        if: steps.pages.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: site

      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
